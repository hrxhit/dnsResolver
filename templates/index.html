<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNS Resolver Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #09090b;
            --bg-surface: #121215;
            --bg-subtle: #18181b;
            --bg-muted: #27272a;
            --border-subtle: #27272a;
            --border-strong: #3f3f46;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --text-dim: #71717a;
            
            --accent-blue: #3b82f6;
            --accent-blue-subtle: rgba(59, 130, 246, 0.12);
            --emerald: #10b981;
            --emerald-subtle: rgba(16, 185, 129, 0.12);
            --amber: #f59e0b;
            --amber-subtle: rgba(245, 158, 11, 0.12);
            --rose: #f43f5e;
            --rose-subtle: rgba(244, 63, 94, 0.12);
            --purple: #a855f7;
            --purple-subtle: rgba(168, 85, 247, 0.12);
            --cyan: #06b6d4;
            --cyan-subtle: rgba(6, 182, 212, 0.12);
            
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .mono {
            font-family: var(--font-mono);
        }

        /* Top Navigation Bar */
        .navbar {
            border-bottom: 1px solid var(--border-subtle);
            background: rgba(9, 9, 11, 0.85);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .nav-container {
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-main);
        }

        .brand-badge {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            background: var(--bg-subtle);
            border: 1px solid var(--border-strong);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .brand-text h1 {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--text-main);
        }

        .brand-text p {
            font-size: 12px;
            color: var(--text-dim);
            font-family: var(--font-mono);
        }

        .nav-meta {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .protocol-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 500;
            background: var(--bg-subtle);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            font-family: var(--font-mono);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--emerald);
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
        }

        /* App Container */
        .main-container {
            max-width: 1180px;
            margin: 0 auto;
            padding: 28px 24px 80px 24px;
        }

        /* Hero Query Section */
        .query-panel {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.5);
        }

        .query-grid {
            display: grid;
            grid-template-columns: 1fr 140px 150px auto;
            gap: 12px;
            align-items: end;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            font-size: 14px;
            pointer-events: none;
        }

        input[type="text"] {
            width: 100%;
            height: 44px;
            padding: 0 14px 0 38px;
            background: var(--bg-base);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            color: var(--text-main);
            font-family: var(--font-mono);
            font-size: 14px;
            transition: all 0.15s ease;
            outline: none;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px var(--accent-blue-subtle);
        }

        input[type="text"]::placeholder {
            color: var(--text-dim);
        }

        select {
            width: 100%;
            height: 44px;
            padding: 0 12px;
            background: var(--bg-base);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            color: var(--text-main);
            font-size: 13px;
            font-weight: 500;
            outline: none;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-resolve {
            height: 44px;
            padding: 0 20px;
            background: var(--text-main);
            color: var(--bg-base);
            font-weight: 600;
            font-size: 13px;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .btn-resolve:hover {
            background: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.15);
        }

        .btn-resolve:active {
            transform: translateY(0);
        }

        /* Secondary actions bar */
        .actions-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid var(--border-subtle);
            flex-wrap: wrap;
            gap: 12px;
        }

        .presets {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .preset-label {
            font-size: 12px;
            color: var(--text-dim);
            font-weight: 500;
        }

        .preset-chip {
            background: var(--bg-subtle);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: 11px;
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .preset-chip:hover {
            border-color: var(--border-strong);
            color: var(--text-main);
            background: var(--bg-muted);
        }

        .secondary-tools {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-secondary {
            height: 32px;
            padding: 0 12px;
            background: var(--bg-subtle);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 500;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-secondary:hover {
            background: var(--bg-muted);
            border-color: var(--border-strong);
            color: var(--text-main);
        }

        /* KPI / Stat Badges Strip */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 16px;
        }

        .stat-card-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-dim);
            margin-bottom: 6px;
        }

        .stat-card-value {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-main);
            font-family: var(--font-mono);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            font-family: var(--font-mono);
            text-transform: uppercase;
        }

        .badge-success { background: var(--emerald-subtle); color: var(--emerald); border: 1px solid rgba(16, 185, 129, 0.2); }
        .badge-error { background: var(--rose-subtle); color: var(--rose); border: 1px solid rgba(244, 63, 94, 0.2); }
        .badge-warn { background: var(--amber-subtle); color: var(--amber); border: 1px solid rgba(245, 158, 11, 0.2); }
        .badge-neutral { background: var(--bg-subtle); color: var(--text-muted); border: 1px solid var(--border-subtle); }
        .badge-cyan { background: var(--cyan-subtle); color: var(--cyan); border: 1px solid rgba(6, 182, 212, 0.2); }

        /* Record Types */
        .type-tag {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            font-family: var(--font-mono);
        }
        .type-A { background: var(--emerald-subtle); color: var(--emerald); }
        .type-AAAA { background: var(--cyan-subtle); color: var(--cyan); }
        .type-MX { background: var(--purple-subtle); color: var(--purple); }
        .type-NS { background: var(--amber-subtle); color: var(--amber); }
        .type-CNAME { background: var(--accent-blue-subtle); color: var(--accent-blue); }
        .type-TXT { background: var(--bg-muted); color: var(--text-muted); }

        /* Content Cards */
        .card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            margin-bottom: 20px;
            overflow: hidden;
        }

        .card-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.01);
        }

        .card-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.01em;
        }

        .card-body {
            padding: 0;
        }

        /* Clean Data Table */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: left;
        }

        .data-table th {
            padding: 10px 18px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-dim);
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-subtle);
        }

        .data-table td {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-subtle);
            color: var(--text-main);
            vertical-align: middle;
        }

        .data-table tr:last-child td {
            border-bottom: none;
        }

        .data-table tr:hover td {
            background: rgba(255, 255, 255, 0.015);
        }

        .data-value {
            font-family: var(--font-mono);
            font-weight: 500;
            color: #fff;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        /* Stepped Resolution Timeline */
        .timeline {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .timeline-step {
            position: relative;
            padding: 16px;
            border-radius: var(--radius-md);
            background: var(--bg-base);
            border: 1px solid var(--border-subtle);
            display: grid;
            grid-template-columns: 80px 1fr auto;
            gap: 16px;
            align-items: start;
        }

        .step-num {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            padding-top: 2px;
        }

        .step-main {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .step-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .step-ip {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-muted);
        }

        .step-desc {
            font-size: 12px;
            color: var(--text-dim);
            margin-top: 4px;
        }

        .step-badge-box {
            margin-top: 6px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .step-latency {
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            background: var(--bg-subtle);
            border: 1px solid var(--border-subtle);
            padding: 3px 8px;
            border-radius: var(--radius-sm);
            white-space: nowrap;
        }

        /* Benchmarking Bars */
        .benchmark-box {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .bench-row {
            display: grid;
            grid-template-columns: 140px 1fr 90px;
            gap: 14px;
            align-items: center;
        }

        .bench-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .bench-track {
            height: 28px;
            background: var(--bg-base);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-subtle);
            overflow: hidden;
            position: relative;
        }

        .bench-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            padding-left: 10px;
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 600;
        }

        .bench-iterative { background: #2563eb; color: #fff; }
        .bench-recursive { background: #7c3aed; color: #fff; }
        .bench-system { background: #059669; color: #fff; }

        .bench-time {
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 600;
            text-align: right;
            color: var(--text-main);
        }

        /* Loading Skeleton */
        .loading-state {
            display: none;
            padding: 48px 20px;
            text-align: center;
        }

        .loader {
            width: 24px;
            height: 24px;
            border: 2px solid var(--border-strong);
            border-top-color: var(--text-main);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-placeholder {
            padding: 60px 20px;
            text-align: center;
            color: var(--text-dim);
            font-size: 13px;
        }

        /* Footer */
        .footer {
            margin-top: 48px;
            padding-top: 24px;
            border-top: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-dim);
            flex-wrap: wrap;
            gap: 12px;
        }

        .footer a {
            color: var(--text-muted);
            text-decoration: none;
        }

        .footer a:hover {
            color: var(--text-main);
        }

        /* Mobile Responsive */
        @media (max-width: 860px) {
            .query-grid {
                grid-template-columns: 1fr;
            }
            .timeline-step {
                grid-template-columns: 1fr;
                gap: 8px;
            }
            .bench-row {
                grid-template-columns: 100px 1fr 70px;
            }
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <header class="navbar">
        <div class="nav-container">
            <a href="/" class="brand">
                <div class="brand-badge">⚡</div>
                <div class="brand-text">
                    <h1>DNS Resolver</h1>
                    <p>RFC 1035 UDP Engine</p>
                </div>
            </a>
            <div class="nav-meta">
                <span class="protocol-pill">
                    <span class="status-dot"></span>
                    UDP : 53
                </span>
                <span class="protocol-pill">Python 3.14</span>
            </div>
        </div>
    </header>

    <!-- Main Viewport -->
    <main class="main-container">

        <!-- Query Form Panel -->
        <section class="query-panel">
            <div class="query-grid">
                <div class="input-group">
                    <label for="domain">Target Domain Name</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🌐</span>
                        <input type="text" id="domain" placeholder="e.g. google.com, github.com" autocomplete="off" spellcheck="false" autofocus>
                    </div>
                </div>

                <div class="input-group">
                    <label for="qtype">Record Type</label>
                    <select id="qtype">
                        <option value="A" selected>A (IPv4)</option>
                        <option value="AAAA">AAAA (IPv6)</option>
                        <option value="MX">MX (Mail)</option>
                        <option value="NS">NS (Nameserver)</option>
                        <option value="CNAME">CNAME (Alias)</option>
                        <option value="TXT">TXT (Text)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="mode">Resolution Mode</label>
                    <select id="mode">
                        <option value="iterative" selected>Iterative (Root➔Auth)</option>
                        <option value="recursive">Recursive (8.8.8.8)</option>
                    </select>
                </div>

                <button class="btn-resolve" onclick="executeResolve()">
                    <span>Query DNS</span>
                    <span style="font-family: var(--font-mono); font-size: 11px; opacity: 0.7;">↵</span>
                </button>
            </div>

            <!-- Presets & Quick Actions -->
            <div class="actions-bar">
                <div class="presets">
                    <span class="preset-label">Quick Test:</span>
                    <button class="preset-chip" onclick="setPreset('google.com', 'A', 'iterative')">google.com</button>
                    <button class="preset-chip" onclick="setPreset('github.com', 'A', 'iterative')">github.com</button>
                    <button class="preset-chip" onclick="setPreset('cloudflare.com', 'NS', 'iterative')">cloudflare.com (NS)</button>
                    <button class="preset-chip" onclick="setPreset('gmail.com', 'MX', 'recursive')">gmail.com (MX)</button>
                </div>
                <div class="secondary-tools">
                    <button class="btn-secondary" onclick="executeCompare()">
                        <span>⚡ Benchmark vs System</span>
                    </button>
                    <button class="btn-secondary" onclick="fetchCacheStats()">
                        <span>💾 Inspect Cache</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- Loading State -->
        <div id="loading" class="loading-state">
            <div class="loader"></div>
            <p style="font-size: 13px; color: var(--text-dim); font-family: var(--font-mono);">Sending UDP Datagram over port 53...</p>
        </div>

        <!-- Dynamic Output Container -->
        <div id="results" style="display: none;"></div>

        <!-- Initial Placeholder -->
        <div id="empty-state" class="card empty-placeholder">
            <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 6px;">Ready for DNS Resolution</p>
            <p style="font-size: 12px; color: var(--text-dim); font-family: var(--font-mono);">Enter a domain or click any quick test preset above.</p>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <div>Computer Networks Project &bull; <strong>Harshit Sharma</strong></div>
            <div>No external DNS libraries &bull; Pure RFC 1035 UDP Binary Packets</div>
        </footer>

    </main>

    <script>
        // Trigger on Enter
        document.getElementById('domain').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') executeResolve();
        });

        function setPreset(domain, type, mode) {
            document.getElementById('domain').value = domain;
            document.getElementById('qtype').value = type;
            document.getElementById('mode').value = mode;
            executeResolve();
        }

        function showLoading() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').style.display = 'none';
            document.getElementById('empty-state').style.display = 'none';
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }

        async function executeResolve() {
            const domain = document.getElementById('domain').value.trim();
            const qtype = document.getElementById('qtype').value;
            const mode = document.getElementById('mode').value;

            if (!domain) {
                alert('Please provide a domain name (e.g., google.com)');
                return;
            }

            showLoading();

            try {
                const response = await fetch('/api/resolve', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ domain, type: qtype, mode })
                });

                const data = await response.json();
                hideLoading();
                renderResults(data);
            } catch (err) {
                hideLoading();
                renderError('Network error connecting to resolver daemon: ' + err.message);
            }
        }

        async function executeCompare() {
            const domain = document.getElementById('domain').value.trim();
            const qtype = document.getElementById('qtype').value;

            if (!domain) {
                alert('Please provide a domain name to benchmark');
                return;
            }

            showLoading();

            try {
                const response = await fetch('/api/compare', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ domain, type: qtype })
                });

                const data = await response.json();
                hideLoading();
                renderBenchmark(data, domain);
            } catch (err) {
                hideLoading();
                renderError('Failed to execute benchmark: ' + err.message);
            }
        }

        async function fetchCacheStats() {
            showLoading();
            try {
                const response = await fetch('/api/cache');
                const data = await response.json();
                hideLoading();
                renderCache(data);
            } catch (err) {
                hideLoading();
                renderError('Failed to fetch cache statistics: ' + err.message);
            }
        }

        function renderResults(data) {
            const out = document.getElementById('results');
            out.style.display = 'block';

            let statusBadge = data.success 
                ? `<span class="badge badge-success">NOERROR (0)</span>` 
                : `<span class="badge badge-error">${data.rcode || 'FAILED'}</span>`;

            let cacheBadge = data.from_cache 
                ? `<span class="badge badge-cyan">CACHE HIT</span>` 
                : `<span class="badge badge-neutral">NETWORK MISS</span>`;

            let html = `
                <!-- Stats Row -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-card-label">Response Status</div>
                        <div class="stat-card-value">${statusBadge}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-label">Total Latency</div>
                        <div class="stat-card-value">${data.time_ms}<span style="font-size: 13px; color: var(--text-dim);">ms</span></div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-label">Resolution Mode</div>
                        <div class="stat-card-value" style="font-size: 15px; text-transform: uppercase;">${data.mode}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-label">Cache State</div>
                        <div class="stat-card-value">${cacheBadge}</div>
                    </div>
                </div>
            `;

            if (data.error) {
                html += `
                    <div class="card" style="border-color: rgba(244, 63, 94, 0.3); background: rgba(244, 63, 94, 0.05); padding: 16px 20px;">
                        <div style="color: var(--rose); font-size: 13px; font-weight: 500;">
                            ⚠️ Resolution Alert: ${data.error}
                        </div>
                    </div>
                `;
            }

            // Answer Section
            if (data.answers && data.answers.length > 0) {
                html += `
                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">
                                <span>📋 Answer Section</span>
                                <span class="badge badge-neutral">${data.answers.length} Records</span>
                            </div>
                            <span style="font-size: 11px; color: var(--text-dim); font-family: var(--font-mono);">RFC 1035 Resource Records</span>
                        </div>
                        <div class="card-body">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>Name</th>
                                        <th>Type</th>
                                        <th>TTL</th>
                                        <th>Resource Data (RDATA)</th>
                                    </tr>
                                </thead>
                                <tbody>
                `;

                data.answers.forEach(rec => {
                    html += `
                        <tr>
                            <td class="mono" style="color: var(--text-muted);">${rec.name}</td>
                            <td><span class="type-tag type-${rec.type}">${rec.type}</span></td>
                            <td class="mono" style="color: var(--text-dim);">${rec.ttl}s</td>
                            <td><span class="data-value">${rec.data}</span></td>
                        </tr>
                    `;
                });

                html += `</tbody></table></div></div>`;
            }

            // Step-by-Step Resolution Trace
            if (data.trace && data.trace.length > 0 && !data.from_cache) {
                html += `
                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">
                                <span>🌐 Resolution Hop Trace</span>
                                <span class="badge badge-neutral">${data.trace.length} Hops</span>
                            </div>
                            <span style="font-size: 11px; color: var(--text-dim); font-family: var(--font-mono);">Root ➔ TLD ➔ Authoritative</span>
                        </div>
                        <div class="card-body timeline">
                `;

                data.trace.forEach((step, idx) => {
                    let serverLabel = step.from_cache ? 'Local Memory Cache' : step.server_name;
                    let ipLabel = step.server_ip ? `(${step.server_ip})` : '';

                    let referralBadges = '';
                    if (step.referrals && step.referrals.length > 0) {
                        referralBadges = step.referrals.map(r => `<span class="badge badge-warn">↪ Referral: ${r}</span>`).join(' ');
                    }

                    let answerBadges = '';
                    if (step.answers && step.answers.length > 0) {
                        answerBadges = step.answers.map(a => `<span class="badge badge-success">✓ ${a.type}: ${a.data}</span>`).join(' ');
                    }

                    html += `
                        <div class="timeline-step">
                            <div class="step-num">Hop 0${idx + 1}</div>
                            <div class="step-main">
                                <div class="step-title">
                                    <span>${serverLabel}</span>
                                    <span class="step-ip">${ipLabel}</span>
                                </div>
                                <div class="step-desc">
                                    Querying <strong style="color: var(--text-muted); font-family: var(--font-mono);">${step.domain}</strong> (${step.type})
                                </div>
                                <div class="step-badge-box">
                                    ${referralBadges}
                                    ${answerBadges}
                                </div>
                            </div>
                            <div class="step-latency">${step.time_ms} ms</div>
                        </div>
                    `;
                });

                html += `</div></div>`;
            }

            // Authority Section
            if (data.authority && data.authority.length > 0) {
                html += `
                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">
                                <span>🏛️ Authority Section</span>
                                <span class="badge badge-neutral">${data.authority.length} Nameservers</span>
                            </div>
                        </div>
                        <div class="card-body">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>Zone</th>
                                        <th>Type</th>
                                        <th>TTL</th>
                                        <th>Authoritative Server</th>
                                    </tr>
                                </thead>
                                <tbody>
                `;

                data.authority.forEach(rec => {
                    html += `
                        <tr>
                            <td class="mono" style="color: var(--text-muted);">${rec.name}</td>
                            <td><span class="type-tag type-${rec.type}">${rec.type}</span></td>
                            <td class="mono" style="color: var(--text-dim);">${rec.ttl}s</td>
                            <td class="mono" style="color: var(--text-main);">${rec.data}</td>
                        </tr>
                    `;
                });

                html += `</tbody></table></div></div>`;
            }

            out.innerHTML = html;
        }

        function renderBenchmark(data, domain) {
            const out = document.getElementById('results');
            out.style.display = 'block';

            if (!data.success) {
                renderError(data.error);
                return;
            }

            const comp = data.comparison;
            const maxVal = Math.max(
                comp.iterative?.time_ms || 1,
                comp.recursive?.time_ms || 1,
                comp.system?.time_ms || 1
            );

            let html = `
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">
                            <span>⚡ Latency Benchmark</span>
                            <span class="badge badge-neutral">${domain}</span>
                        </div>
                        <span style="font-size: 11px; color: var(--text-dim); font-family: var(--font-mono);">Side-by-side execution</span>
                    </div>
                    <div class="card-body benchmark-box">
            `;

            const methods = [
                { key: 'iterative', label: 'Iterative Resolver', class: 'bench-iterative' },
                { key: 'recursive', label: 'Recursive (8.8.8.8)', class: 'bench-recursive' },
                { key: 'system', label: 'Host System DNS', class: 'bench-system' }
            ];

            methods.forEach(m => {
                const item = comp[m.key];
                if (!item) return;

                const widthPct = Math.max((item.time_ms / maxVal) * 100, 8);
                const cachedTag = item.from_cache ? '<span class="badge badge-cyan" style="margin-left: 8px;">Cached</span>' : '';
                const answersList = item.answers ? item.answers.slice(0, 3).join(', ') : '';

                html += `
                    <div class="bench-row">
                        <div class="bench-label">${m.label}</div>
                        <div class="bench-track">
                            <div class="bench-fill ${m.class}" style="width: ${widthPct}%;">
                                ${item.time_ms} ms
                            </div>
                        </div>
                        <div class="bench-time">${item.time_ms} ms</div>
                    </div>
                    <div style="font-size: 11px; font-family: var(--font-mono); color: var(--text-dim); margin-left: 154px; margin-top: -8px; margin-bottom: 8px;">
                        Answers: ${answersList || 'None'} ${cachedTag}
                    </div>
                `;
            });

            html += `</div></div>`;
            out.innerHTML = html;
        }

        function renderCache(data) {
            const out = document.getElementById('results');
            out.style.display = 'block';

            const s = data.stats;
            let html = `
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-card-label">Stored Entries</div>
                        <div class="stat-card-value">${s.total_entries} <span style="font-size: 13px; color: var(--text-dim);">/ ${s.max_size}</span></div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-label">Hit Ratio</div>
                        <div class="stat-card-value" style="color: var(--emerald);">${s.hit_rate}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-label">Cache Hits</div>
                        <div class="stat-card-value">${s.hits}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-label">Cache Misses</div>
                        <div class="stat-card-value">${s.misses}</div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <div class="card-title">
                            <span>💾 Active In-Memory Records</span>
                            <span class="badge badge-neutral">${data.entries.length} Cached</span>
                        </div>
                        <button class="btn-secondary" style="height: 28px;" onclick="purgeCache()">Purge Cache</button>
                    </div>
                    <div class="card-body">
            `;

            if (data.entries.length > 0) {
                html += `
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Domain</th>
                                <th>Type</th>
                                <th>Remaining TTL</th>
                                <th>Hit Count</th>
                                <th>Cached Data</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                data.entries.forEach(e => {
                    html += `
                        <tr>
                            <td class="mono" style="color: var(--text-main); font-weight: 500;">${e.domain}</td>
                            <td><span class="type-tag type-${e.type}">${e.type}</span></td>
                            <td class="mono" style="color: var(--emerald);">${e.ttl_remaining}s</td>
                            <td class="mono">${e.hits}</td>
                            <td class="mono" style="color: var(--text-muted);">${e.records.join(', ')}</td>
                        </tr>
                    `;
                });

                html += `</tbody></table>`;
            } else {
                html += `<div style="padding: 36px; text-align: center; color: var(--text-dim); font-size: 13px; font-family: var(--font-mono);">Cache table is currently empty</div>`;
            }

            html += `</div></div>`;
            out.innerHTML = html;
        }

        async function purgeCache() {
            if (confirm('Flush all in-memory DNS cache entries?')) {
                await fetch('/api/cache/clear', { method: 'POST' });
                fetchCacheStats();
            }
        }

        function renderError(msg) {
            const out = document.getElementById('results');
            out.style.display = 'block';
            out.innerHTML = `
                <div class="card" style="border-color: rgba(244, 63, 94, 0.3); background: rgba(244, 63, 94, 0.05); padding: 24px; text-align: center;">
                    <div style="font-size: 16px; margin-bottom: 6px;">⚠️</div>
                    <div style="color: var(--rose); font-size: 13px; font-weight: 500;">${msg}</div>
                </div>
            `;
        }
    </script>
</body>
</html>

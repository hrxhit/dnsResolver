<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNS Resolver &bull; Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Palette directly inspired by reference design */
            --canvas-bg: #dbe4ee;
            --card-bg: #ffffff;
            --dark-pill: #16181f;
            --dark-pill-hover: #262933;
            
            --text-heading: #12141a;
            --text-body: #4a5060;
            --text-muted: #8890a1;
            --text-light: #b0b7c6;
            
            --coral-primary: #ff6347;
            --coral-subtle: #ffede8;
            --mint-primary: #10b981;
            --mint-subtle: #e2f8ef;
            --sky-primary: #0284c7;
            --sky-card: #e3f2fd;
            --sky-subtle: #ecf6fd;
            --purple-primary: #8b5cf6;
            --purple-subtle: #f3e8ff;
            --amber-primary: #f59e0b;
            --amber-subtle: #fef3c7;
            
            --border-soft: rgba(0, 0, 0, 0.05);
            --card-shadow: 0 14px 34px -6px rgba(18, 20, 26, 0.06), 0 2px 8px -1px rgba(18, 20, 26, 0.02);
            --pill-shadow: 0 10px 24px -4px rgba(22, 24, 31, 0.25);
            
            --radius-card: 28px;
            --radius-pill: 9999px;
            --radius-element: 18px;
            
            --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-code: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--canvas-bg);
            color: var(--text-heading);
            min-height: 100vh;
            padding: 32px 18px 120px 18px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .mono {
            font-family: var(--font-code);
        }

        /* App Layout Shell */
        .app-shell {
            max-width: 980px;
            margin: 0 auto;
        }

        /* Top Header Bar */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .brand-badge-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-circle {
            width: 46px;
            height: 46px;
            background: #ffffff;
            border-radius: var(--radius-pill);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.04);
            font-size: 20px;
        }

        .user-greeting {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            padding: 6px 16px 6px 8px;
            border-radius: var(--radius-pill);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .avatar-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffd3b6, #ffaaa5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 700;
            color: #552723;
        }

        .greeting-text {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-heading);
            letter-spacing: -0.01em;
        }

        .top-action-pill {
            background: var(--dark-pill);
            color: #ffffff;
            padding: 8px 18px;
            border-radius: var(--radius-pill);
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(22, 24, 31, 0.15);
        }

        .dot-live {
            width: 7px;
            height: 7px;
            background: #22c55e;
            border-radius: 50%;
            display: inline-block;
        }

        /* Section Title Row */
        .title-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .main-title {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--text-heading);
        }

        .session-tag {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.6);
            padding: 6px 14px;
            border-radius: var(--radius-pill);
        }

        /* Metric Highlights Cards (Like Calories & Weight in ref) */
        .highlights-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        .mini-card {
            background: var(--card-bg);
            border-radius: var(--radius-card);
            padding: 22px 24px;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--border-soft);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 140px;
        }

        .mini-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .icon-bubble {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
        }

        .bubble-coral { background: var(--coral-subtle); color: var(--coral-primary); }
        .bubble-mint { background: var(--mint-subtle); color: var(--mint-primary); }
        .bubble-sky { background: var(--sky-subtle); color: var(--sky-primary); }

        .metric-sub {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            font-family: var(--font-code);
        }

        .metric-label {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-heading);
            margin-top: 8px;
        }

        .metric-desc {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.4;
            margin-bottom: 8px;
        }

        .metric-value-box {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .metric-big {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text-heading);
        }

        .metric-unit {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
        }

        /* Query Input Card */
        .query-card {
            background: var(--card-bg);
            border-radius: var(--radius-card);
            padding: 24px;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--border-soft);
            margin-bottom: 24px;
        }

        .input-pill-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .domain-input-wrapper {
            flex: 1;
            min-width: 260px;
            position: relative;
        }

        .domain-input {
            width: 100%;
            height: 52px;
            background: #f4f7fb;
            border: 1px solid rgba(0, 0, 0, 0.04);
            border-radius: var(--radius-pill);
            padding: 0 22px 0 46px;
            font-size: 15px;
            font-family: var(--font-code);
            font-weight: 500;
            color: var(--text-heading);
            outline: none;
            transition: all 0.2s ease;
        }

        .domain-input:focus {
            background: #ffffff;
            border-color: var(--text-heading);
            box-shadow: 0 0 0 4px rgba(22, 24, 31, 0.06);
        }

        .domain-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
            pointer-events: none;
        }

        .pill-select {
            height: 52px;
            background: #f4f7fb;
            border: 1px solid rgba(0, 0, 0, 0.04);
            border-radius: var(--radius-pill);
            padding: 0 20px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-heading);
            outline: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .pill-select:focus {
            border-color: var(--text-heading);
            background: #fff;
        }

        .btn-resolve-main {
            height: 52px;
            padding: 0 28px;
            background: var(--dark-pill);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-pill);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
            box-shadow: 0 8px 20px rgba(22, 24, 31, 0.18);
            white-space: nowrap;
        }

        .btn-resolve-main:hover {
            background: var(--dark-pill-hover);
            transform: translateY(-1px);
        }

        .btn-resolve-main:active {
            transform: translateY(0);
        }

        /* Preset Chips Row */
        .preset-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px dashed rgba(0, 0, 0, 0.06);
            flex-wrap: wrap;
        }

        .preset-chip-pill {
            background: #f4f7fb;
            border: 1px solid transparent;
            color: var(--text-body);
            font-size: 12px;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: var(--radius-pill);
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: var(--font-code);
        }

        .preset-chip-pill:hover {
            background: #e6edf5;
            color: var(--text-heading);
        }

        /* Main Results Container */
        .card-main {
            background: var(--card-bg);
            border-radius: var(--radius-card);
            padding: 28px;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--border-soft);
            margin-bottom: 24px;
        }

        .card-top-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .card-heading {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-heading);
            letter-spacing: -0.02em;
        }

        /* Status Badge Pills */
        .tag-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: var(--radius-pill);
            font-size: 12px;
            font-weight: 700;
            font-family: var(--font-code);
        }

        .tag-success { background: var(--mint-subtle); color: var(--mint-primary); }
        .tag-coral { background: var(--coral-subtle); color: var(--coral-primary); }
        .tag-sky { background: var(--sky-subtle); color: var(--sky-primary); }
        .tag-purple { background: var(--purple-subtle); color: var(--purple-primary); }
        .tag-neutral { background: #f0f4f9; color: var(--text-muted); }

        /* Answer Table */
        .records-clean-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
        }

        .records-clean-table th {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            padding: 0 16px 8px 16px;
            text-align: left;
        }

        .record-row-pill {
            background: #f8fafc;
            border-radius: var(--radius-element);
            transition: all 0.15s ease;
        }

        .record-row-pill:hover {
            background: #f1f5f9;
        }

        .record-row-pill td {
            padding: 16px;
            font-size: 14px;
        }

        .record-row-pill td:first-child {
            border-top-left-radius: var(--radius-element);
            border-bottom-left-radius: var(--radius-element);
        }

        .record-row-pill td:last-child {
            border-top-right-radius: var(--radius-element);
            border-bottom-right-radius: var(--radius-element);
        }

        .rdata-highlight {
            font-family: var(--font-code);
            font-weight: 700;
            color: var(--text-heading);
            background: #ffffff;
            padding: 6px 14px;
            border-radius: var(--radius-pill);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
            display: inline-block;
        }

        /* Stepped Timeline Activity Card */
        .activity-card {
            background: var(--sky-card);
            border-radius: var(--radius-card);
            padding: 28px;
            box-shadow: var(--card-shadow);
            margin-bottom: 24px;
        }

        .step-pill-item {
            background: #ffffff;
            border-radius: 20px;
            padding: 18px 22px;
            margin-bottom: 12px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .step-left-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .step-index-badge {
            width: 32px;
            height: 32px;
            background: #f1f5f9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 800;
            color: var(--text-heading);
        }

        .step-names {
            font-weight: 700;
            font-size: 14px;
            color: var(--text-heading);
        }

        .step-ip-meta {
            font-size: 12px;
            font-family: var(--font-code);
            color: var(--text-muted);
            margin-top: 2px;
        }

        .step-time-pill {
            background: var(--coral-subtle);
            color: var(--coral-primary);
            font-size: 12px;
            font-weight: 700;
            font-family: var(--font-code);
            padding: 6px 12px;
            border-radius: var(--radius-pill);
        }

        /* Benchmark Horizontal Bars (Like activities graph in ref) */
        .bench-bar-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 10px;
        }

        .bench-item-pill {
            display: grid;
            grid-template-columns: 140px 1fr 80px;
            gap: 16px;
            align-items: center;
        }

        .bench-track-pill {
            height: 36px;
            background: #f1f5f9;
            border-radius: var(--radius-pill);
            overflow: hidden;
            padding: 4px;
        }

        .bench-fill-pill {
            height: 100%;
            border-radius: var(--radius-pill);
            display: flex;
            align-items: center;
            padding-left: 14px;
            color: #ffffff;
            font-size: 12px;
            font-weight: 700;
            font-family: var(--font-code);
            transition: width 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .fill-coral { background: var(--coral-primary); }
        .fill-dark { background: var(--dark-pill); }
        .fill-mint { background: var(--mint-primary); }

        /* Floating Bottom Dock (Directly from reference) */
        .floating-dock {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--dark-pill);
            padding: 10px 18px;
            border-radius: var(--radius-pill);
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--pill-shadow);
            z-index: 100;
        }

        .dock-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: var(--radius-pill);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dock-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
        }

        .dock-btn.active {
            background: #ffffff;
            color: var(--dark-pill);
        }

        /* Loading */
        .loading-box {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .spinner-pill {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(22, 24, 31, 0.1);
            border-top-color: var(--coral-primary);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .highlights-grid { grid-template-columns: 1fr; }
            .input-pill-group { flex-direction: column; align-items: stretch; }
            .pill-select, .btn-resolve-main { width: 100%; justify-content: center; }
            .bench-item-pill { grid-template-columns: 1fr; gap: 6px; }
            .floating-dock { width: 90%; justify-content: space-around; padding: 8px; }
            .dock-btn { padding: 8px 10px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <div class="app-shell">

        <!-- Top Bar with Avatar -->
        <header class="top-bar">
            <div class="brand-badge-box">
                <div class="brand-circle">🌐</div>
                <div class="user-greeting">
                    <div class="avatar-circle">S</div>
                    <span class="greeting-text">Hello, Sarah 👋</span>
                </div>
            </div>

            <div class="top-action-pill">
                <span class="dot-live"></span>
                <span>UDP Port 53</span>
            </div>
        </header>

        <!-- Main Title -->
        <div class="title-row">
            <h1 class="main-title">DNS Dashboard</h1>
            <span class="session-tag mono">RFC 1035 &bull; Python Engine</span>
        </div>

        <!-- 2 Metric Cards (Like Calories & Weight in ref) -->
        <section class="highlights-grid">
            <div class="mini-card">
                <div class="mini-card-header">
                    <div class="icon-bubble bubble-coral">🔥</div>
                    <span class="metric-sub" id="hero-status">NOERROR</span>
                </div>
                <div>
                    <div class="metric-label">Latency Speed</div>
                    <div class="metric-desc">Socket round-trip resolution time</div>
                </div>
                <div class="metric-value-box">
                    <span class="metric-big" id="hero-latency">0.0</span>
                    <span class="metric-unit">ms</span>
                </div>
            </div>

            <div class="mini-card">
                <div class="mini-card-header">
                    <div class="icon-bubble bubble-mint">💾</div>
                    <span class="metric-sub" id="hero-cache-status">READY</span>
                </div>
                <div>
                    <div class="metric-label">Memory Cache</div>
                    <div class="metric-desc">In-memory TTL record storage</div>
                </div>
                <div class="metric-value-box">
                    <span class="metric-big" id="hero-hops">0</span>
                    <span class="metric-unit">Hops / Referrals</span>
                </div>
            </div>
        </section>

        <!-- Query Pill Card -->
        <section class="query-card">
            <div class="input-pill-group">
                <div class="domain-input-wrapper">
                    <span class="domain-icon">🔍</span>
                    <input type="text" id="domain" class="domain-input" placeholder="Enter domain (e.g. google.com)" spellcheck="false" autocomplete="off" autofocus>
                </div>

                <select id="qtype" class="pill-select">
                    <option value="A" selected>A &bull; IPv4</option>
                    <option value="AAAA">AAAA &bull; IPv6</option>
                    <option value="MX">MX &bull; Mail</option>
                    <option value="NS">NS &bull; Nameserver</option>
                    <option value="CNAME">CNAME &bull; Alias</option>
                    <option value="TXT">TXT &bull; Text</option>
                </select>

                <select id="mode" class="pill-select">
                    <option value="iterative" selected>Iterative (Root➔TLD➔Auth)</option>
                    <option value="recursive">Recursive (8.8.8.8)</option>
                </select>

                <button class="btn-resolve-main" onclick="executeResolve()">
                    <span>Resolve</span>
                    <span>➔</span>
                </button>
            </div>

            <!-- Quick Presets -->
            <div class="preset-row">
                <span style="font-size: 12px; font-weight: 700; color: var(--text-muted); margin-right: 4px;">Quick Test:</span>
                <button class="preset-chip-pill" onclick="setPreset('google.com', 'A', 'iterative')">google.com</button>
                <button class="preset-chip-pill" onclick="setPreset('github.com', 'A', 'iterative')">github.com</button>
                <button class="preset-chip-pill" onclick="setPreset('cloudflare.com', 'NS', 'iterative')">cloudflare.com (NS)</button>
                <button class="preset-chip-pill" onclick="setPreset('gmail.com', 'MX', 'recursive')">gmail.com (MX)</button>
            </div>
        </section>

        <!-- Loading Spinner -->
        <div id="loading" class="loading-box">
            <div class="spinner-pill"></div>
            <p style="font-size: 13px; font-weight: 600; color: var(--text-muted);">Crafting UDP datagram and traversing root servers...</p>
        </div>

        <!-- Dynamic Output Container -->
        <div id="results"></div>

    </div>

    <!-- Floating Bottom Dock (Reference-style Pill Nav) -->
    <nav class="floating-dock">
        <button class="dock-btn active" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
            <span>🏠</span>
            <span>Dashboard</span>
        </button>
        <button class="dock-btn" onclick="executeCompare()">
            <span>⚡</span>
            <span>Benchmark</span>
        </button>
        <button class="dock-btn" onclick="fetchCacheStats()">
            <span>💾</span>
            <span>Cache Table</span>
        </button>
        <button class="dock-btn" onclick="clearCacheAction()">
            <span>🗑️</span>
            <span>Flush</span>
        </button>
    </nav>

    <script>
        document.getElementById('domain').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') executeResolve();
        });

        function setPreset(domain, type, mode) {
            document.getElementById('domain').value = domain;
            document.getElementById('qtype').value = type;
            document.getElementById('mode').value = mode;
            executeResolve();
        }

        function showLoading() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').style.display = 'none';
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }

        async function executeResolve() {
            const domain = document.getElementById('domain').value.trim();
            const qtype = document.getElementById('qtype').value;
            const mode = document.getElementById('mode').value;

            if (!domain) {
                alert('Please enter a domain name');
                return;
            }

            showLoading();

            try {
                const response = await fetch('/api/resolve', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ domain, type: qtype, mode })
                });

                const data = await response.json();
                hideLoading();
                renderResults(data);
            } catch (err) {
                hideLoading();
                alert('Resolution error: ' + err.message);
            }
        }

        async function executeCompare() {
            const domain = document.getElementById('domain').value.trim() || 'google.com';
            const qtype = document.getElementById('qtype').value;

            showLoading();

            try {
                const response = await fetch('/api/compare', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ domain, type: qtype })
                });

                const data = await response.json();
                hideLoading();
                renderBenchmark(data, domain);
            } catch (err) {
                hideLoading();
                alert('Benchmark error: ' + err.message);
            }
        }

        async function fetchCacheStats() {
            showLoading();
            try {
                const response = await fetch('/api/cache');
                const data = await response.json();
                hideLoading();
                renderCache(data);
            } catch (err) {
                hideLoading();
                alert('Cache fetch error: ' + err.message);
            }
        }

        async function clearCacheAction() {
            if (confirm('Clear all cached DNS records?')) {
                await fetch('/api/cache/clear', { method: 'POST' });
                fetchCacheStats();
            }
        }

        function renderResults(data) {
            const out = document.getElementById('results');
            out.style.display = 'block';

            // Update Top Mini Cards
            document.getElementById('hero-status').innerText = data.rcode || (data.success ? 'NOERROR' : 'ERROR');
            document.getElementById('hero-latency').innerText = data.time_ms;
            document.getElementById('hero-cache-status').innerText = data.from_cache ? 'CACHE HIT' : 'NETWORK MISS';
            document.getElementById('hero-hops').innerText = data.trace ? data.trace.length : 1;

            let html = '';

            // Answer Card
            if (data.answers && data.answers.length > 0) {
                html += `
                    <div class="card-main">
                        <div class="card-top-title">
                            <h2 class="card-heading">Answers &bull; ${data.domain}</h2>
                            <span class="tag-pill tag-success">${data.answers.length} Records Found</span>
                        </div>
                        <table class="records-clean-table">
                            <thead>
                                <tr>
                                    <th>Host Name</th>
                                    <th>Type</th>
                                    <th>TTL Expiry</th>
                                    <th>Resource Data (IP)</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                data.answers.forEach(rec => {
                    html += `
                        <tr class="record-row-pill">
                            <td class="mono" style="font-weight: 600;">${rec.name}</td>
                            <td><span class="tag-pill tag-purple">${rec.type}</span></td>
                            <td class="mono" style="color: var(--text-muted);">${rec.ttl}s</td>
                            <td><span class="rdata-highlight">${rec.data}</span></td>
                        </tr>
                    `;
                });

                html += `</tbody></table></div>`;
            }

            // Resolution Hop Timeline (Activity Card)
            if (data.trace && data.trace.length > 0 && !data.from_cache) {
                html += `
                    <div class="activity-card">
                        <div class="card-top-title">
                            <h2 class="card-heading" style="color: #0c4a6e;">Resolution Hops (${data.mode})</h2>
                            <span class="tag-pill tag-sky">${data.trace.length} Steps</span>
                        </div>
                `;

                data.trace.forEach((step, idx) => {
                    let serverName = step.from_cache ? 'Local Cache' : step.server_name;
                    let serverIp = step.server_ip ? `(${step.server_ip})` : '';

                    html += `
                        <div class="step-pill-item">
                            <div class="step-left-info">
                                <div class="step-index-badge">${idx + 1}</div>
                                <div>
                                    <div class="step-names">${serverName}</div>
                                    <div class="step-ip-meta">Query: ${step.domain} [${step.type}] &bull; ${serverIp}</div>
                                </div>
                            </div>
                            <span class="step-time-pill">${step.time_ms} ms</span>
                        </div>
                    `;
                });

                html += `</div>`;
            }

            out.innerHTML = html;
        }

        function renderBenchmark(data, domain) {
            const out = document.getElementById('results');
            out.style.display = 'block';

            const comp = data.comparison;
            const maxVal = Math.max(
                comp.iterative?.time_ms || 1,
                comp.recursive?.time_ms || 1,
                comp.system?.time_ms || 1
            );

            let html = `
                <div class="card-main">
                    <div class="card-top-title">
                        <h2 class="card-heading">Benchmark Comparison &bull; ${domain}</h2>
                        <span class="tag-pill tag-coral">Latency Performance</span>
                    </div>
                    <div class="bench-bar-container">
            `;

            const methods = [
                { key: 'iterative', name: 'Iterative (Root➔Auth)', fill: 'fill-coral' },
                { key: 'recursive', name: 'Recursive (8.8.8.8)', fill: 'fill-dark' },
                { key: 'system', name: 'Host System DNS', fill: 'fill-mint' }
            ];

            methods.forEach(m => {
                const item = comp[m.key];
                if (!item) return;

                const pct = Math.max((item.time_ms / maxVal) * 100, 10);
                html += `
                    <div class="bench-item-pill">
                        <span style="font-size: 13px; font-weight: 700;">${m.name}</span>
                        <div class="bench-track-pill">
                            <div class="bench-fill-pill ${m.fill}" style="width: ${pct}%;">
                                ${item.time_ms} ms
                            </div>
                        </div>
                        <span class="mono" style="font-weight: 700; text-align: right;">${item.time_ms} ms</span>
                    </div>
                `;
            });

            html += `</div></div>`;
            out.innerHTML = html;
        }

        function renderCache(data) {
            const out = document.getElementById('results');
            out.style.display = 'block';

            const s = data.stats;
            let html = `
                <div class="card-main">
                    <div class="card-top-title">
                        <h2 class="card-heading">Active Memory Cache</h2>
                        <span class="tag-pill tag-success">Hit Rate: ${s.hit_rate}</span>
                    </div>
            `;

            if (data.entries.length > 0) {
                html += `
                    <table class="records-clean-table">
                        <thead>
                            <tr>
                                <th>Domain</th>
                                <th>Type</th>
                                <th>TTL Remaining</th>
                                <th>Hits</th>
                                <th>Cached Data</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                data.entries.forEach(e => {
                    html += `
                        <tr class="record-row-pill">
                            <td class="mono" style="font-weight: 700;">${e.domain}</td>
                            <td><span class="tag-pill tag-purple">${e.type}</span></td>
                            <td class="mono" style="color: var(--mint-primary); font-weight: 700;">${e.ttl_remaining}s</td>
                            <td class="mono">${e.hits}</td>
                            <td class="mono" style="font-weight: 600;">${e.records.join(', ')}</td>
                        </tr>
                    `;
                });

                html += `</tbody></table>`;
            } else {
                html += `<div style="text-align:center; padding: 30px; color: var(--text-muted); font-size: 13px;">Cache memory is empty. Run queries to populate.</div>`;
            }

            html += `</div>`;
            out.innerHTML = html;
        }
    </script>
</body>
</html>
